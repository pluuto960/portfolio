let currentLang = 'en';

function formatDuration(startDate, labels, endDate = new Date()){
  const start = new Date(`${startDate}T00:00:00`);
  let months = (endDate.getFullYear() - start.getFullYear()) * 12;
  months += endDate.getMonth() - start.getMonth();
  if(endDate.getDate() < start.getDate()) months -= 1;
  months = Math.max(0, months);

  const years = Math.floor(months / 12);
  const remainingMonths = months % 12;
  const duration = [];
  if(years) duration.push(`${years} ${years === 1 ? labels.year : labels.years}`);
  if(remainingMonths) duration.push(`${remainingMonths} ${remainingMonths === 1 ? labels.month : labels.months}`);
  return duration.join(', ') || labels.lessThanMonth;
}

const DISCORD_GUILD_ID = '1475890268900298755';
const DISCORD_INVITE_URL = 'https://discord.gg/vkQ5PJGsrm';
const DISCORD_API_URL = 'https://discord.com/api/v10/invites/vkQ5PJGsrm?with_counts=true';

function setDiscordText(key, value){
  document.getElementById(key).textContent = value;
}

function renderDiscordLabels(labels){
  setDiscordText('label-discord', labels.discord);
  setDiscordText('label-members', labels.members);
  setDiscordText('label-online', labels.online);
  const join = document.getElementById('discord-join');
  join.textContent = labels.joinDiscord;
}

async function loadDiscordStatus(){
  const members = document.getElementById('discord-members');
  const online = document.getElementById('discord-online');
  const status = document.getElementById('discord-status');
  const live = document.getElementById('discord-live');
  const join = document.getElementById('discord-join');

  if(DISCORD_INVITE_URL){
    join.href = DISCORD_INVITE_URL;
    join.hidden = false;
  }

  if(!DISCORD_GUILD_ID){
    members.textContent = '--';
    online.textContent = '--';
    live.hidden = true;
    status.textContent = currentLang === 'et'
      ? 'Lisa serveri ID, et näha reaalajas statistikat.'
      : 'Add the server ID to show live statistics.';
    return;
  }

  try {
    const response = await fetch(DISCORD_API_URL);
    if(!response.ok) throw new Error('Discord widget unavailable');
    const data = await response.json();
    members.textContent = data.approximate_member_count ?? '--';
    online.textContent = data.approximate_presence_count ?? '--';
    status.textContent = data.guild?.name || 'Life in San Andreas';
    live.hidden = false;
  } catch(error) {
    members.textContent = '--';
    online.textContent = '--';
    live.hidden = true;
    status.textContent = currentLang === 'et'
      ? 'Discordi statistika pole hetkel saadaval.'
      : 'Discord statistics are currently unavailable.';
  }
}

function render(lang){
  const c = content[lang];
  currentLang = lang;

  document.getElementById('html-root').setAttribute('lang', lang);
  document.getElementById('bio').textContent = c.bio;

  document.getElementById('label-projects').textContent = c.labels.projects;
  document.getElementById('label-events').textContent = c.labels.events;
  document.getElementById('label-trophies').textContent = c.labels.trophies;
  document.getElementById('label-companies').textContent = c.labels.companies;
  document.getElementById('footer-text').textContent = c.footer;
  renderDiscordLabels(c.labels);

  document.getElementById('projects').innerHTML = c.projects.map((p, i) => `
    <div class="project-box" data-index="${i}">
      <div class="date">${p.date}</div>
      <h3>${p.name}</h3>
      <p>${p.desc}</p>
    </div>
  `).join('');

  document.getElementById('events').innerHTML = [...c.events].reverse().map(e => {
    const head = `<span class="event-name">${e.name}</span><span class="event-date">${e.date}</span>`;
    if(!e.details) return `<li class="event-item event-plain">${head}</li>`;
    return `
      <li class="event-item">
        <details>
          <summary>${head}<span class="event-chevron" aria-hidden="true"></span></summary>
          <p class="event-details">${e.details}</p>
        </details>
      </li>
    `;
  }).join('');

  document.getElementById('trophies').innerHTML = [...c.trophies].reverse().map(t => {
    const rank = parseInt(t.result, 10);
    const top = t.highlight || (Number.isFinite(rank) && rank <= 10);
    return `
      <div class="trophy-row">
        <div class="trophy-main">
          <span class="trophy-name">${t.name}</span>
          <span class="trophy-year">${t.year}</span>
        </div>
        <span class="trophy-result${top ? ' is-top' : ''}">${t.result}</span>
      </div>
    `;
  }).join('');

  document.getElementById('companies').innerHTML = [...c.companies].reverse().map(co => `
    <div class="company-box">
      <div class="company-info">
        <span class="company-name">${co.name}</span>
        <span class="role">${co.role}</span>
      </div>
      <div class="company-meta">
        <span class="period">${co.period}</span>
        <span class="duration">${c.labels.workedFor}: ${formatDuration(co.startDate, c.labels, co.endDate ? new Date(`${co.endDate}T00:00:00`) : new Date())}</span>
      </div>
    </div>
  `).join('');

  // hide the modal/tooltip in case the language changes while one is open
  closeModal();
  hidePreview();
}

function setLang(lang){
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-et').classList.toggle('active', lang === 'et');
  render(lang);
}

/* ---------------- hover preview ---------------- */
const previewEl = document.getElementById('hover-preview');

function hidePreview(){
  previewEl.style.display = 'none';
}

document.getElementById('projects').addEventListener('mousemove', (e) => {
  const box = e.target.closest('.project-box');
  if(!box){ hidePreview(); return; }
  const project = content[currentLang].projects[box.dataset.index];
  if(!project) return;

  previewEl.textContent = project.preview || project.desc;
  previewEl.style.display = 'block';

  const offset = 16;
  let x = e.clientX + offset;
  let y = e.clientY + offset;
  // keep the tooltip on-screen
  const maxX = window.innerWidth - 240;
  const maxY = window.innerHeight - 80;
  if(x > maxX) x = e.clientX - 220 - offset;
  if(y > maxY) y = e.clientY - 60 - offset;

  previewEl.style.left = x + 'px';
  previewEl.style.top = y + 'px';
});

document.getElementById('projects').addEventListener('mouseleave', hidePreview);

/* ---------------- project detail modal ---------------- */
const modalOverlay = document.getElementById('modal-overlay');

function openModal(project){
  document.getElementById('modal-date').textContent = project.date;
  document.getElementById('modal-title').textContent = project.name;
  document.getElementById('modal-details').textContent = project.details || project.desc;
  const discordPanel = document.getElementById('modal-discord');
  discordPanel.hidden = !project.discord;
  if(project.discord) loadDiscordStatus();

  document.getElementById('modal-tags').innerHTML = (project.tags || [])
    .map(t => `<span class="tag">${t}</span>`).join('');

  const linkEl = document.getElementById('modal-link');
  if(project.link){
    linkEl.href = project.link;
    linkEl.textContent = 'View project →';
    linkEl.style.display = 'inline-block';
  } else {
    linkEl.style.display = 'none';
  }

  const ucpLinkEl = document.getElementById('modal-ucp-link');
  if(project.ucpLink){
    ucpLinkEl.href = project.ucpLink;
    ucpLinkEl.textContent = 'Open UCP →';
    ucpLinkEl.style.display = 'inline-block';
  } else {
    ucpLinkEl.style.display = 'none';
  }

  modalOverlay.classList.add('active');
  hidePreview();
}

function closeModal(){
  modalOverlay.classList.remove('active');
}

document.getElementById('projects').addEventListener('click', (e) => {
  const box = e.target.closest('.project-box');
  if(!box) return;
  const project = content[currentLang].projects[box.dataset.index];
  if(project) openModal(project);
});

document.getElementById('modal-close').addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => {
  if(e.target === modalOverlay) closeModal();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') closeModal();
});

render('en');
